[project]
name = "secura"
version = "2.0.0"
description = "A security scanner that explains every finding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*ScriptRunContext.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"backend/ai/knowledge/entries.py" = ["S104"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
